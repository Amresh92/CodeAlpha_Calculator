<!DOCTYPE html>
<html>
<head>
    <title>Advanced Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator" id="calculator">

    <div class="top-bar">
        <span>Calculator</span>
        <div>
            <button onclick="minimizeCalc()">_</button>
            <button onclick="fullScreenCalc()">□</button>
            <button onclick="closeCalc()">×</button>
        </div>
    </div>

    <div class="calc-body" id="calcBody">
        <input type="text" id="display" readonly>

        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('/')">÷</button>
            <button onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')">−</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="calculate()">=</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="toggleHistory()">History</button>
            <button onclick="clearHistory()">clearHistory</button>
        </div>

        <div class="history" id="historyBox">
            <h3>History</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

</div>

<button class="open-btn" id="openBtn" onclick="openCalc()">Open Calculator</button>

<script src="script.js"></script>
</body>
</html>
